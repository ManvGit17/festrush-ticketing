name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

# Code scanning is free for public repositories only, so on a private repository this job
# is skipped instead of failing at the upload step. It starts running once the repository is public.
jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # A job-level block replaces the top-level one, so contents must be listed again.
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.13"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check src tests scripts locust bench main.py
      - run: uv run ruff check src tests scripts locust bench main.py
      - run: uv run mypy

  test:
    name: Tests (PostgreSQL 18)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: festrush
          POSTGRES_PASSWORD: festrush-dev
          POSTGRES_DB: festrush_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U festrush -d festrush_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      FESTRUSH_TEST_DATABASE_URL: postgresql://festrush:festrush-dev@localhost:5432/festrush_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Run tests against a real PostgreSQL 18
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  legacy:
    name: Legacy v1 (pinned original dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Run the v1 characterization suite
        run: >-
          uv run --no-project --with-requirements tests/characterization/requirements-legacy.txt
          pytest tests/characterization --confcutdir=tests/characterization
          -m legacy -o addopts="" -q

  stack:
    name: Docker Compose smoke test and load check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Check the app end to end
        run: |
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/readyz
          curl -fsS http://localhost:8080/events | grep -q "Hackathon"
          curl -fsS http://localhost:8088/api/events | grep -q "Hackathon"   # through the gateway
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/metrics)" = 404   # hidden
      - name: A short run of the real user journey (fails on any error)
        run: |
          uv sync --locked
          uv run locust -f locust/locust/journey_locustfile.py --host http://localhost:8080 \
            --headless -u 10 -r 10 -t 15s --only-summary
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v

  concurrency:
    name: Seat rush (300 students, 30 seats)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: festrush
          POSTGRES_PASSWORD: festrush-dev
          POSTGRES_DB: festrush_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U festrush -d festrush_bench"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      FESTRUSH_BENCH_DATABASE_URL: postgresql://festrush:festrush-dev@localhost:5432/festrush_bench
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Each safe strategy sells exactly the seats it has, and every invariant holds
        run: |
          for strategy in row_lock atomic_update skip_locked; do
            uv run python bench/run.py --strategy "$strategy" --users 300 --seats 30               --web-workers 2 --label "ci-$strategy"
          done
      - name: The naive baseline oversells (the delay widens its race window, as a slow hop would)
        run: |
          uv run python bench/run.py --strategy naive --naive-delay-ms 5 --users 300 --seats 30             --web-workers 2 --expect-oversell --label ci-naive
      - name: Retried writes (every request sent twice with the same key) take effect once
        run: |
          uv run python bench/run.py --strategy atomic_update --scenario retry-storm             --users 300 --seats 30 --web-workers 2 --label ci-storm
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: seat-rush-results
          path: bench/results/

  chaos:
    name: Chaos (worker, payments, database)
    runs-on: ubuntu-latest
    env:
      FESTRUSH_BENCH_DATABASE_URL: postgresql://festrush:festrush-dev@localhost:5440/festrush_bench
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Start PostgreSQL (the database fault needs one Compose can stop and start)
        run: docker compose up -d --wait db
      - name: Kill the worker mid-run, then put it back
        run: |
          uv run python bench/run.py --strategy atomic_update --users 300 --seats 30 --web-workers 2 \
            --chaos kill-worker --chaos-at 1 --chaos-for 6 --label ci-chaos-worker
      - name: Kill the payments service mid-run, then put it back
        run: |
          uv run python bench/run.py --strategy atomic_update --users 300 --seats 30 --web-workers 2 \
            --payments-service --chaos kill-payments --chaos-at 1 --chaos-for 5 --label ci-chaos-payments
      - name: Stop PostgreSQL for five seconds mid-run
        run: |
          uv run python bench/run.py --strategy atomic_update --users 100 --seats 20 --web-workers 2 \
            --chaos restart-db --chaos-at 2 --chaos-for 5 --label ci-chaos-db
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chaos-results
          path: bench/results/
      - name: Stop
        if: always()
        run: docker compose down -v

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pip-audit --skip-editable

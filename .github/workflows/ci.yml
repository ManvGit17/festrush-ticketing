name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.13"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check src tests scripts locust main.py
      - run: uv run ruff check src tests scripts locust main.py
      - run: uv run mypy

  test:
    name: Tests (PostgreSQL 18)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: festrush
          POSTGRES_PASSWORD: festrush-dev
          POSTGRES_DB: festrush_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U festrush -d festrush_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      FESTRUSH_TEST_DATABASE_URL: postgresql://festrush:festrush-dev@localhost:5432/festrush_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Run tests against a real PostgreSQL 18
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  legacy:
    name: Legacy v1 (pinned original dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Run the v1 characterization suite
        run: >-
          uv run --no-project --with-requirements tests/characterization/requirements-legacy.txt
          pytest tests/characterization --confcutdir=tests/characterization
          -m legacy -o addopts="" -q

  stack:
    name: Docker Compose smoke test and load check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Check the app end to end
        run: |
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/readyz
          curl -fsS http://localhost:8080/events | grep -q "Hackathon"
      - name: A short run of the real user journey (fails on any error)
        run: |
          uv sync --locked
          uv run locust -f locust/locust/journey_locustfile.py --host http://localhost:8080 \
            --headless -u 10 -r 10 -t 15s --only-summary
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pip-audit --skip-editable

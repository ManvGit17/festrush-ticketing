[project]
name = "festrush"
version = "2.0.0"
description = "College-fest ticketing that cannot oversell, with the load tests to prove it."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "The FestRush authors" }]
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-psycopg>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "prometheus-client>=0.26.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
festrush = "festrush.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "locust>=2.46.0",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/festrush"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The v1 characterization suite needs the old dependency versions; CI runs it separately with -m legacy.
addopts = "-ra --strict-markers -m 'not legacy'"
markers = [
    "slow: starts real subprocesses and kills them",
    "legacy: pins the original v1 behaviour; needs tests/characterization/requirements-legacy.txt",
]

[tool.coverage.run]
source = ["festrush"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S311", "S608"]
"scripts/**" = ["S310"]
"bench/**" = ["E501", "S106", "B007", "B023", "S311", "S603", "S607", "S310", "S608"]  # subprocess and SQL built from fixed names
"locust/**" = ["S105", "S311"]  # throwaway load-test accounts and random choice

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
exclude = ["tests/characterization"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
